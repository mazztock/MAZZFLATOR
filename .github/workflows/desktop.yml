# Compile MAZZFLATOR pour ordinateur (Mac, Windows, Linux) et fabrique les installeurs.
# - lancement à la main (onglet Actions -> Run workflow) : fichiers à télécharger dans le résumé du lancement
# - tag « desktop-vX.Y.Z » : en plus, création de la release GitHub avec les 3 installeurs
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

env:
  JUCE_TAG: '9.0.5'
  CLAP_JUCE_COMMIT: 6bde108329ff9fc24404b79b8b397261a75cf6a8
  VERSION: '2.0.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macOS }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04,   name: Linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4

      - name: JUCE et clap-juce-extensions
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          git clone https://github.com/free-audio/clap-juce-extensions.git "$RUNNER_TEMP/clap-juce-extensions"
          cd "$RUNNER_TEMP/clap-juce-extensions" && git checkout "$CLAP_JUCE_COMMIT" && git submodule update --init --recursive

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev

      - name: Configuration
        run: |
          cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release -DMAZZ_COPY=OFF \
            -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DCLAP_JUCE_DIR="$RUNNER_TEMP/clap-juce-extensions"

      - name: Compilation
        run: |
          case "$RUNNER_OS" in
            macOS)   T="Mazzflator_AU Mazzflator_VST3 Mazzflator_CLAP" ;;
            Windows) T="Mazzflator_VST3 Mazzflator_CLAP" ;;
            Linux)   T="Mazzflator_VST3 Mazzflator_CLAP Mazzflator_LV2" ;;
          esac
          cmake --build build --config Release --parallel 4 --target $T

      - name: Installeur Mac (.pkg)
        if: runner.os == 'macOS'
        run: |
          desktop/installer/mac/build_pkg.sh build/Mazzflator_artefacts/Release "$VERSION" dist
          lipo -info build/Mazzflator_artefacts/Release/VST3/MAZZFLATOR.vst3/Contents/MacOS/MAZZFLATOR

      - name: Installeur Windows (.exe)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          ART="$(cygpath -w "$PWD/build/Mazzflator_artefacts/Release")"
          OUT="$(cygpath -w "$PWD/dist")"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVer=$VERSION" "//DArt=$ART" "//DOutDir=$OUT" desktop/installer/windows/mazzflator.iss

      - name: Archive Linux (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          D="MAZZFLATOR-$VERSION-Linux-x64"
          mkdir -p "pkg/$D" dist
          cp -R build/Mazzflator_artefacts/Release/VST3/MAZZFLATOR.vst3 "pkg/$D/"
          cp build/Mazzflator_artefacts/Release/CLAP/MAZZFLATOR.clap "pkg/$D/"
          cp -R build/Mazzflator_artefacts/Release/LV2/MAZZFLATOR.lv2 "pkg/$D/"
          cp desktop/installer/linux/install.sh LICENSE "pkg/$D/"
          tar -C pkg -czf "dist/$D.tar.gz" "$D"

      - uses: actions/upload-artifact@v4
        with:
          name: MAZZFLATOR-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: MAZZFLATOR ${{ env.VERSION }} – Mac / Windows / Linux
          files: dist/*
